# ============================================================
# DEPLOYED PRODUCTION PROFILE (PostgreSQL + SendGrid)
# ============================================================

# DATABASE CONFIG (PostgreSQL via ENV)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SERVER
server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# JSON
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# PAGINATION
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# LOGGING
logging.level.com.certifyme.app=INFO
logging.level.org.springframework.security=DEBUG

# MAIL (SendGrid SMTP)
# spring.mail.username must always be the literal string 'apikey' for SendGrid.
# EMAIL_PASS = your SendGrid API Key (starts with SG.) — set in Railway.
# app.mail.from is injected directly from the Railway env var named 'app.mail.from'.
#   It MUST be a verified sender in your SendGrid account (Single Sender Verification).
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# NOTE: Do NOT override app.mail.from here.
# Spring Boot reads the Railway env var 'app.mail.from' directly into EmailService.
# Railway env var: APP_MAIL_FROM = <your verified SendGrid sender email>
# Spring relaxed binding maps APP_MAIL_FROM → app.mail.from automatically.
app.mail.from=${APP_MAIL_FROM}
