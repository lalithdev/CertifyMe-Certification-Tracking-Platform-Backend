spring.application.name=certifyme

# ============================================================
# DATABASE (PostgreSQL via Render ENV variables)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# SERVER
# ============================================================
server.port=${PORT:8080}

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ============================================================
# JSON SERIALIZATION
# ============================================================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# ============================================================
# PAGINATION
# ============================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ============================================================
# SENDGRID API (NOT SMTP — uses official SDK)
# ============================================================
app.sendgrid.api-key=${SENDGRID_API_KEY}
app.mail.from=${APP_MAIL_FROM}

# ============================================================
# LOGGING
# ============================================================
logging.level.com.certifyme.app=INFO
logging.level.org.springframework.security=DEBUG
