spring.application.name=certifyme

# ============================================================
# ACTIVE PROFILE SELECTION
# Defaults to 'dev' for local development.
# On Railway, set SPRING_PROFILES_ACTIVE=prod as an ENV variable.
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================================
# UNIFIED MAIL CONFIGURATION (SendGrid)
# ============================================================
# Using Port 465 (SSL) to bypass common network blocks in cloud environments.
spring.mail.host=smtp.sendgrid.net
spring.mail.port=465
spring.mail.username=apikey
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.sendgrid.net
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# Verified sender address from SendGrid account.
# Ensure APP_MAIL_FROM is set in Railway/Local Environment.
app.mail.from=${APP_MAIL_FROM:verify.certifyme@gmail.com}
